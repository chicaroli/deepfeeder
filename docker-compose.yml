services:
  deephaven:
    build:
      context: ./feeder_server
      dockerfile: Dockerfile
    container_name: deepfeeder-dh
    env_file:
      - .env
    ports:
      - "10001:10001"   # gRPC
      - "10000:10000"   # UI
    environment:
      PYTHONPATH: /data/app.d
      START_OPTS: >-
        -Xms2g 
        -Xmx4g 
        -DAuthHandlers=io.deephaven.auth.AnonymousAuthenticationHandler 
        -Ddeephaven.application.dir=/data/app.d 
        -Ddeephaven.application.enabled=true
      DEEPFEEDER_REGISTER_UI: "${DEEPFEEDER_REGISTER_UI:-1}"
      DEEPFEEDER_AUTOSTART: "${DEEPFEEDER_AUTOSTART:-1}"
    volumes:
      - ./feeder_server/data:/data
    restart: unless-stopped
    networks:
      - eagle_nest

  feeder_client:
    build:
      context: ./feeder_client
      dockerfile: Dockerfile
    container_name: feeder-client
    depends_on:
      - deephaven
    volumes:
      - ./:/workspace
    restart: unless-stopped
    networks:
      - eagle_nest

networks:
  eagle_nest:
    external: false
