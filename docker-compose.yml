services:
  deephaven:
    build: 
      context: .
      dockerfile: Dockerfile.dh
    container_name: deepfeeder-dh
    ports:
      - "10001:10001"   # gRPC
      - "10000:10000"   # UI
    environment:
      PYTHONPATH: /data/app.d
      START_OPTS: >-
        -Xms1g 
        -Xmx2g 
        -DAuthHandlers=io.deephaven.auth.AnonymousAuthenticationHandler 
        -Ddeephaven.application.dir=/data/app.d 
        -Ddeephaven.application.enabled=true
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - eagle_nest

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: deepfeeder-client
    volumes:
      - .:/workspace
    networks:
      - eagle_nest
    # Optionally expose ports for debugging or Jupyter
    ports:
      - "8888:8888"

networks:
  eagle_nest:
    external: false
