[project]
name = "deepfeeder-server"
version = "1.0.0"
description = "DeepFeeder is a real-time market data feeder framework built on Deephaven"
requires-python = ">=3.10"
authors = [
    {name = "Rodrigo Chicaroli", email = "chicaroli@gmail.com"}
]
dependencies = [
    "websocket-client>=1.8.0",
    "pyarrow>=14",
    "duckdb>=1.3.2",
    "requests>=2.31.0",
    "tradingview-datafeed>=2.1.1",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
]

[tool.uv]
dev-dependencies = ["pytest", "ruff", "mypy"]

[tool.ruff]
exclude = ["build", "dist", ".venv", "runs", "research"]
line-length = 120
fix = false

[tool.ruff.lint]
select = ["E", "F", "W", "C", "B"]
ignore = ["F401", "F403", "C901", "E402"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:pytest-pycache"]
python_files = ["test_*.py", "*_test.py", "tests_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "unit: fast unit tests that mock IO",
  "integration: slower tests that touch disk/threads",
  "dh: requires Deephaven runtime",
]
