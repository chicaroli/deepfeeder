[project]
name = "deepfeeder"
version = "1.0.0"
description = "DeepFeeder is a real-time market data feeder framework built on Deephaven"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.3.2",
    "pandas-stubs==2.3.2.250827",
    "pyarrow>=21.0.0",
    "requests>=2.32.5",
    "tradingview-datafeed>=2.1.1",
    "websocket-client>=1.8.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.5",
    "ruff>=0.11.8",
    "mypy>=1.5.1"
]

[tool.ruff]
exclude = ["build", "dist", ".venv", "runs", "research"]
line-length = 120
fix = false

[tool.ruff.lint]
select = ["E", "F", "W", "C", "B"]
ignore = ["F401", "F403", "C901", "E402"]


[tool.pytest.ini_options]
testpaths = ["feeder_server/data/app.d/tests"]
norecursedirs = [".git", ".venv", "venv", "build", "dist", "node_modules", "__pycache__"]
addopts = ["-p", "no:pytest-pycache"]
python_files = ["test_*.py", "*_test.py", "tests_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "unit: fast unit tests that mock IO",
  "integration: slower tests that touch disk/threads",
  "dh: requires Deephaven runtime",
]
