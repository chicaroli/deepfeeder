[project]
name = "feeder-client"
version = "0.1.0"
description = "Client library for DeepFeeder data streaming"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Rodrigo Chicaroli", email = "chicaroli@gmail.com"}
]
dependencies = [
    "pydeephaven>=0.32.0",
    "websocket-client>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/chicaroli/deepfeeder"
Repository = "https://github.com/chicaroli/deepfeeder"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest", "ruff", "mypy"]

[tool.ruff]
exclude = ["build", "dist", ".venv", "runs", "research"]
line-length = 120
fix = false

[tool.ruff.lint]
select = ["E", "F", "W", "C", "B"]
ignore = ["F401", "F403", "C901", "E402"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:pytest-pycache"]
python_files = ["test_*.py", "*_test.py", "tests_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "unit: fast unit tests that mock IO",
  "integration: slower tests that touch disk/threads",
  "dh: requires Deephaven runtime",
]
